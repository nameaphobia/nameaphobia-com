<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">

  <title>NAMEAPHOBIA — New Phobia Unlocked.</title>
  <meta name="description" content="Name new phobias. New phobia unlocked.">

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #000;
      --red: #ff1010;
      --white: #fff;
      --page-width: 1400px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--black);
    }

    body {
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
    }

    main {
      width: min(100%, var(--page-width));
      min-height: 100vh;
      padding: clamp(20px, 4vw, 56px)
               clamp(16px, 4vw, 48px)
               72px;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .eyes {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto clamp(28px, 5vw, 64px);
    }

    .eyes img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .tagline {
      line-height: 1.0;
      font-weight: 200;
      letter-spacing: 0.02em;
      margin-left: auto;
      margin-right: auto;
    }

    /* =========================
       FIXED NAMEAPHOBIA FOOTER
       ========================= */

    .nameaphobia-footer {
      position: fixed;
      left: 0;
      bottom: 0;

      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;

      /* Keeps it above the iPhone home indicator */
      padding: 8px 16px calc(8px + env(safe-area-inset-bottom));

      z-index: 1000;

      /* Small, subtle and consistent */
      font-family: "Space Grotesk", Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
      line-height: 1;

      color: rgba(255, 255, 255, 0.45);

      /* Prevents accidental selection */
      user-select: none;
    }

    .nameaphobia-footer span {
      white-space: nowrap;
    }

    /* Optional subtle separator */
    .nameaphobia-footer .separator {
      opacity: 0.35;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      main {
        padding-top: 12px;
      }

      .eyes {
        margin-bottom: 0;
        margin-top: 50px;
      }

      .tagline {
        margin-top: 18px;
      }

      .nameaphobia-footer {
        font-size: 9px;
        letter-spacing: 0.07em;
        gap: 10px;
        padding-left: 12px;
        padding-right: 12px;
      }
    }
  </style>
</head>

<body>

  <main>

    <section class="eyes" aria-label="NAMEAPHOBIA eyes">
      <img
        src="images/nameaphobia-eyes-mouth.jpg"
        alt="Horrified bloodshot anime eyes with the word NAMEAPHOBIA looking like an awkward mouth"
      >
    </section>

  </main>


  <!-- Fixed footer -->
  <footer class="nameaphobia-footer" aria-label="Nameaphobia social links">
    <span>#newphobiaunlocked</span>
    <span class="separator">•</span>
    <span>@nameaphobia</span>
  </footer>

</body>
</html>
